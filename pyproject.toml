[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-swe"
version = "0.1.0"
description = "Autonomous Software Engineering Agent with MCTS, AST Code-Graph Navigation, and Sandboxed Execution."
authors = [{ name = "Sameer Ali", email = "sameer2659110@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "tree-sitter>=0.21.3",
    "tree-sitter-languages>=1.10.2",
    "docker>=7.0.0",
    "httpx>=0.27.0",
    "rich>=13.7.1",
    "click>=8.1.7",
    "tenacity>=8.2.3",
    "python-dotenv>=1.0.1",
    "pytest>=8.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest-asyncio>=0.23.5",
    "black>=24.2.0",
    "isort>=5.13.2",
    "mypy>=1.8.0"
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
